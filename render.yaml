services:
  - type: web
    name: tool-agent-web
    env: docker
    plan: free
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: tool-agent
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: READONLY_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: EMAIL_FROM
        value: no-reply@tool-agent.example
      - key: SALES_TEAM_EMAIL
        value: sales@tool-agent.example
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: apikey
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  - type: worker
    name: tool-agent-worker
    env: docker
    plan: free
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    startCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    envVars:
      - key: APP_NAME
        value: tool-agent
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: READONLY_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: apikey
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: EMAIL_FROM
        value: no-reply@tool-agent.example
      - key: SALES_TEAM_EMAIL
        value: sales@tool-agent.example