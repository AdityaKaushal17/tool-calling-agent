# Render Blueprint: free-tier demo deployment.
#   - web: FastAPI API + Celery worker in one container (Render background workers are not free)
#   - Key Value (Redis): rate limiting, Celery broker and result backend
#   - Postgres: bring your own Neon database (Render's free Postgres expires after 30 days)
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo, then fill in the two DB URLs.
services:
  - type: web
    name: tool-calling-agent
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /livez
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: SEED_IF_EMPTY
        value: "750"
      - key: RATE_LIMIT_PER_HOUR
        value: "10"
      - key: DATABASE_URL
        sync: false # Neon owner connection string
      - key: READONLY_DATABASE_URL
        sync: false # same host/db, different user + strong password; role is created on boot
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tool-calling-agent-kv
          property: connectionString
      - key: SMTP_HOST
        sync: false # optional; leave empty to render emails without sending
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: EMAIL_FROM
        value: no-reply@tool-agent.example
      - key: SALES_TEAM_EMAIL
        value: sales@tool-agent.example

  - type: keyvalue
    name: tool-calling-agent-kv
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction # it's a job queue; never evict queued tasks
    ipAllowList: [] # internal network only
